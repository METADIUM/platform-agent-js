# SEA 단일 바이너리 릴리스(doc26 §2-6) — GitHub Release publish 시 4타깃 빌드·서명·자산 업로드.
# 게이트: SHA256SUMS를 minisign으로 서명(secret MINISIGN_SECRET_KEY 필요 — 없으면 실패 = fail-closed).
name: Release binaries
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  binaries:
    runs-on: macos-14   # darwin 코드사인(ad-hoc) 때문에 macOS 러너에서 4타깃 교차 생성
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run build
      - run: node scripts/build-sea.mjs --all
      # 🔴 **바이너리가 자기 판을 말하는지 여기서 잠근다.** v0.5.1 바이너리는 `--version` 이
      #    exit 1 로 «판을 읽지 못했다» 를 냈는데(SEA 에는 package.json 이 없다) 릴리스가
      #    그대로 나갔다 — 아무도 **자산을 받아 돌려 보지 않았기** 때문이다.
      # ⚠️ 파이프·명령치환으로 받지 않는다: 바이너리가 죽으면 종료코드가 삼켜지고
      #    빈 문자열 비교가 «다르다» 로만 보여 **원인이 안 보인다**.
      # ⚠️ **이 실행 검사는 4타깃 중 하나(darwin-arm64)만 돈다** — `macos-14` 러너에서
      #    linux 바이너리를 못 돌린다. 「4타깃이 실행 검증됐다」로 읽지 말 것.
      #    넷이 **같은 번들**에서 나오므로 v0.5.1 의 실패 모양(SEA 에 package.json 이 없다)은
      #    하나로도 잡히고, 타깃별로 갈리는 것은 아래 층①이 실행 없이 전수로 덮는다.
      #    📌 linux-x64 에서도 같은 증상이라는 것은 briefick 이 v0.5.1 자산으로 실측했다.
      # A release must say which compatibility class it is, and `receiver-first`/`breaking`
      # must name the receiver that was confirmed first — shipping before the RP widens is a
      # silent drop on their side (briefick#48/#25). The classes and their two properties come
      # from dist/wire-surface.js, so this gate cannot drift from the source.
      - name: Gate — the release declares its compatibility class
        run: |
          set -euo pipefail
          # 🔴 Read the body LIVE, not from `github.event.release.body`. A **Re-run** replays the
          #    ORIGINAL event payload, so an author who adds the line and clicks "Re-run jobs"
          #    would stay red and be blamed for a line they did write ([Briefick], review of #34).
          RELEASE_BODY=$(gh release view "${{ github.event.release.tag_name }}" --json body -q .body)
          export RELEASE_BODY
          node --input-type=module -e '
            const { AGENT_COMPAT } = await import("./dist/wire-surface.js");
            const { readFileSync } = await import("node:fs");
            const c = JSON.parse(readFileSync("./package.json", "utf8")).agentCompat ?? "";
            const spec = AGENT_COMPAT[c];
            if (!spec) {
              console.error(`package.json agentCompat is missing or unknown: ${JSON.stringify(c)}`);
              console.error(`  expected one of: ${Object.keys(AGENT_COMPAT).join(" | ")}`);
              console.error("  read platform-docs/43-agent-cli-wire-compatibility.md before setting it —");
              console.error("  which class this is decides the deploy order.");
              process.exit(1);
            }
            console.log(`agentCompat = ${c} (coexists=${spec.coexists}, releaseAfterReceiverConfirmed=${spec.releaseAfterReceiverConfirmed})`);
            if (!spec.releaseAfterReceiverConfirmed) process.exit(0);
            // The receiver cannot be probed from here: briefick deploys on user approval with no
            // window, and other organisations run their own installs. So the gate requires the
            // release notes to say which receiver was confirmed, at what version.
            const body = process.env.RELEASE_BODY ?? "";
            // Requires a receiver, a commit sha and a date, so `receiver-confirmed: TODO` does not
            // pass; the optional bullet accepts the markdown form ([Briefick], review of #34).
            const CONFIRMED = /^\s*(?:[-*]\s+)?receiver-confirmed:\s*\S+\s+[0-9a-f]{7,40}\s+on\s+\d{4}-\d{2}-\d{2}/mi;
            if (!CONFIRMED.test(body)) {
              console.error(`agentCompat = ${c} requires the receiver to be confirmed BEFORE this release.`);
              console.error("  Add a line to the release notes and RE-PUBLISH (a workflow Re-run");
              console.error("  replays the old payload; this gate re-reads live, but re-publish is safer):");
              console.error("    receiver-confirmed: briefick 30cf66f on 2026-10-01");
              console.error("  The commit must CONTAIN the widening, not merely be newer:");
              console.error("    git merge-base --is-ancestor <widening> <running>   # in the receiver repo");
              console.error("  If the receiver cannot be queried at all, do not force this: re-cut the");
              console.error("  change as `additive` (new field beside the old one) — nothing needs ordering.");
              console.error("  See platform-docs/43-agent-cli-wire-compatibility.md section 2.3.");
              process.exit(1);
            }
            console.log("receiver confirmation present in the release notes.");
            // What this gate did NOT check: that the class is the right one. `agentCompat` is a
            // human judgement — a replacement labelled `receiver-first` passes here with
            // `coexists: true` recorded against it falsely. Green means the declared class was
            // handled, not that it was declared correctly.
            console.log(`NOT CHECKED: that ${c} is the correct class for this change. Nothing can.`);
            console.log("NOT CHECKED: that the named commit CONTAINS the widening — confirm with");
            console.log("  `git merge-base --is-ancestor <widening> <running>` in the receiver's repo.");
            console.log("NOT CHECKED: any receiver the line does not name. Independent installs are");
            console.log("  unconfirmed by construction — see platform-docs/43 section 2.3.");
            console.log("NOT CHECKED: that a confirmation HAPPENED. This gate measures that a line");
            console.log("  exists and is well-formed. The sha and date make it re-checkable by a");
            console.log("  third party against the receiver; they do not make it true.");
            console.log("NOT CHECKED: that the sha and date RESOLVE. They are matched as shapes and");
            console.log("  never looked up — `deadbeef` and `2026-13-45` both pass this gate.");
          '
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Gate — 바이너리가 말하는 판 == package.json == 태그
        run: |
          set -euo pipefail
          expected=$(node -p "require('./package.json').version")
          tag="${{ github.event.release.tag_name }}"

          # 🔴 **0.5.0 은 릴리스하지 않는다.** npm 에서 deprecate 된 결함 판이다 —
          #    모르는 옵션 오류에 **값이 그대로 노출**되고(`--code=<코드>` · `--url=<주소>`),
          #    `--port=8787` 같은 정상 등호형이 거부되며, `up` 이 `--port` 를 무시한다.
          # ⚠️ 지금 v0.5.0 릴리스가 **없는 것은 우연**이었고, 그 우연이 설치형 사용자를
          #    막아 주고 있었다(briefick 지적). 우연을 규칙으로 바꾼다 —
          #    소급해서 자르면 **설치형 사용자가 값 새는 판을 받게 된다.**
          case "$expected" in
            0.5.0) echo "🔴 0.5.0 은 릴리스 금지 — npm 에서 deprecate 된 결함 판이다."
                   echo "   값 노출·등호형 거부·up --port 무시. 0.5.1 이상을 쓸 것."
                   exit 1 ;;
          esac

          # 🔵 **손목록은 내가 아는 판만 막는다.** 다음 결함 판에도 듣게 npm 을 직접 본다
          #    (briefick 제안). 위 손목록은 그대로 둔다 — **바닥은 로컬**이어야 한다.
          # ⚠️ 이건 네트워크에 기댄다. 조회가 실패하면 **막지 않는다**(손목록이 이미 막고 있고,
          #    네트워크 장애로 릴리스를 못 자르게 하는 것이 더 나쁘다). 그 선을 여기 적어 둔다.
          dep=$(npm view "@metadium-did/platform-agent-js@$expected" deprecated 2>/dev/null || true)
          if [ -n "$dep" ]; then
            echo "🔴 npm 에서 **deprecate 된 판**을 릴리스하려 한다: $expected"
            echo "   사유: $dep"
            exit 1
          fi
          test "$tag" = "v$expected" || {
            echo "🔴 태그($tag)와 package.json(v$expected)이 다르다 — 잘못된 커밋에 태그가 붙었다"; exit 1; }
          # 🔴 **레포 안에서 돌리면 안 된다.** `dist-bin/../package.json` 이 실재해서
          #    박지 않아도 **파일 폴백이 성공**한다 — 게이트가 조용히 초록이 된다(개악으로 확인).
          #    사용자의 조건(옆에 package.json 이 없다)을 만들어서 재야 한다.
          probe=$(mktemp -d)
          cp dist-bin/metapass-agent-darwin-arm64 "$probe/"
          (cd "$probe" && ./metapass-agent-darwin-arm64 --version) > /tmp/sea-version.txt
          actual=$(cat /tmp/sea-version.txt)
          test "$actual" = "$expected" || {
            echo "🔴 바이너리가 말하는 판($actual)이 package.json($expected)과 다르다"; exit 1; }
          echo "🟢 판 일치: $tag == v$actual"

          # 🔴 **사용자 자리에서 한 번 더 부른다** — **경로 구분자 없이** + **bin 밖 cwd**.
          #    ⚠️ 「이름으로 부르면 깨진다」가 아니다 — `cd <bin> && metapass-agent` 는 **산다**
          #    (argv[1] 이 cwd 기준으로 풀려 우연히 일치). 실패는 **둘이 동시에** 성립할 때뿐이고,
          #    아래가 그 둘을 동시에 만드는 유일한 형태다(metapass-saas 가 여섯 형태로 좁혔다).
          #    v0.5.2 까지 이 경로가 **조용히 아무것도 안 했다**(진입 가드가 argv[1] 을 cwd
          #    기준으로 풀었다). 못 잡은 이유는 우리 측정이 **전부 전체 경로**였기 때문이다.
          #    ⇒ 위 검사(전체 경로)와 **다른 것을 잰다.** 둘 다 있어야 한다.
          byname=$(mktemp -d)
          cp dist-bin/metapass-agent-darwin-arm64 "$byname/metapass-agent"
          elsewhere=$(mktemp -d)
          got=$(cd "$elsewhere" && PATH="$byname:$PATH" metapass-agent --version)
          test "$got" = "$expected" || {
            echo "🔴 PATH 로 **이름만** 불렀을 때 판이 안 나온다(받은 값: '$got')"
            echo "   진입 가드가 argv[1] 에 기대고 있다 — SEA 면 argv 와 무관하게 돌아야 한다."
            exit 1; }
          echo "🟢 이름으로 호출해도 판을 말한다: $got"

          # ── 층①: **4타깃 전수** · 실행 불필요 (metapass-saas 제안) ─────────────────
          # 🔴 배포는 4타깃인데 위 실행 검사는 **1타깃**이다. `--define` 이 한 타깃에만
          #    들어가는 개악은 위 검사로 초록이다. 아래는 실행 없이 넷을 다 잰다.
          # ⚠️ 판 검사는 **따옴표를 포함한 고정문자열**이어야 한다. 실측으로 셋을 갈랐다:
          #      정확행 `grep -x '0.5.2'`   판을 박아도 **0건** → 거짓 빨강
          #                                 (번들에서 `return "0.5.2"` 로 접혀 독립된 줄이 아니다)
          #      정규식 `grep '0.5.2'`      안 박은 바이너리에서 **8건** → 거짓 초록
          #                                 (`.` 가 와일드카드라 base64 잡음에 맞는다)
          #      `grep -F '"0.5.2"'`        박음 1 · 안 박음 0 (네 바이너리 대조) → 이것을 쓴다
          # ⚠️ `file` 문자열은 추측하지 않고 v0.5.1 자산 헤더를 받아 **실측**했다:
          #    darwin 은 `x86_64`, linux 는 `x86-64` 로 표기가 다르다.
          fail=0
          for t in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            bin="dist-bin/metapass-agent-$t"
            if [ ! -f "$bin" ]; then echo "🔴 $t: 자산이 없다"; fail=1; continue; fi
            desc=$(file -b "$bin")
            case "$t" in
              darwin-arm64) want="Mach-O 64-bit executable arm64" ;;
              darwin-x64)   want="Mach-O 64-bit executable x86_64" ;;
              linux-x64)    want="ELF 64-bit LSB executable, x86-64" ;;
              linux-arm64)  want="ELF 64-bit LSB executable, ARM aarch64" ;;
            esac
            case "$desc" in
              *"$want"*) : ;;
              *) echo "🔴 $t: 아키텍처가 이름과 다르다 — $desc"; fail=1 ;;
            esac
            n=$(strings -a "$bin" | grep -cF -- "\"$expected\"" || true)
            if [ "$n" -lt 1 ]; then echo "🔴 $t: 판 '$expected' 이 번들에 안 박혔다"; fail=1; fi
            if ! grep -q "  metapass-agent-$t$" dist-bin/SHA256SUMS; then
              echo "🔴 $t: SHA256SUMS 에 없다"; fail=1; fi
          done
          [ "$fail" -eq 0 ] || { echo "🔴 층① 전수 검사 실패"; exit 1; }
          echo "🟢 층① 4타깃 전수 통과 (아키텍처 · 박힌 판 · SHA256SUMS)"
      - name: Sign SHA256SUMS (minisign — 릴리스 게이트)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          test -n "$MINISIGN_SECRET_KEY" || { echo "MINISIGN_SECRET_KEY secret 미설정 — 서명 없는 릴리스는 금지(fail-closed)"; exit 1; }
          brew install minisign
          printf '%s\n' "$MINISIGN_SECRET_KEY" > /tmp/minisign.key
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -Sm dist-bin/SHA256SUMS -s /tmp/minisign.key
          rm -f /tmp/minisign.key
      # 🔴 **게이트가 실패하면 릴리스는 이미 공개돼 있다**(`on: release: published` 는 릴리스
      #    객체가 생긴 **뒤** 돈다). 그대로 두면 «공개된 릴리스 + 자산 0개» 가 남고,
      #    소비처의 `gh release download <tag> -p install.sh` 가 **404** 로 죽는다.
      # ⚠️ v0.5.1 보다 조용하다 — 그건 「자산은 있는데 기능이 없는」 거라 쓰면 드러났고,
      #    이건 **설치 자체가 실패**한다(briefick 지적).
      - name: 실패하면 릴리스를 초안으로 되돌린다
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${{ github.event.release.tag_name }}" --draft
          echo "⚠️ 게이트 실패 — 릴리스를 초안으로 되돌렸다. 고친 뒤 다시 publish 하라."

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dist-bin/metapass-agent-darwin-arm64 dist-bin/metapass-agent-darwin-x64 \
            dist-bin/metapass-agent-linux-x64 dist-bin/metapass-agent-linux-arm64 \
            dist-bin/SHA256SUMS dist-bin/SHA256SUMS.minisig scripts/install.sh --clobber
