# SEA 단일 바이너리 릴리스(doc26 §2-6) — GitHub Release publish 시 4타깃 빌드·서명·자산 업로드.
# 게이트: SHA256SUMS를 minisign으로 서명(secret MINISIGN_SECRET_KEY 필요 — 없으면 실패 = fail-closed).
name: Release binaries
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  binaries:
    runs-on: macos-14   # darwin 코드사인(ad-hoc) 때문에 macOS 러너에서 4타깃 교차 생성
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run build
      - run: node scripts/build-sea.mjs --all
      # CVE-2026-106074: a SEA can repeat randomUUID()/randomInt() on every run (key.ts takes jti
      # from randomUUID). Builds a probe SEA with this node; red on repeat.
      # First run: the release options (catches a change that turns the snapshot on). Second run:
      # a snapshot that calls both before it is taken - repeats on 22.23.2, so green means this
      # node carries the fix.
      - run: node scripts/check-sea-entropy.mjs
      - run: node scripts/check-sea-entropy.mjs
        env:
          SEA_OPTIONS_OVERRIDE: '{"useSnapshot":true}'
          SEA_SNAPSHOT_WARMUP: "1"
      # 🔴 **바이너리가 자기 판을 말하는지 여기서 잠근다.** v0.5.1 바이너리는 `--version` 이
      #    exit 1 로 «판을 읽지 못했다» 를 냈는데(SEA 에는 package.json 이 없다) 릴리스가
      #    그대로 나갔다 — 아무도 **자산을 받아 돌려 보지 않았기** 때문이다.
      # ⚠️ 파이프·명령치환으로 받지 않는다: 바이너리가 죽으면 종료코드가 삼켜지고
      #    빈 문자열 비교가 «다르다» 로만 보여 **원인이 안 보인다**.
      # ⚠️ **이 실행 검사는 4타깃 중 하나(darwin-arm64)만 돈다** — `macos-14` 러너에서
      #    linux 바이너리를 못 돌린다. 「4타깃이 실행 검증됐다」로 읽지 말 것.
      #    넷이 **같은 번들**에서 나오므로 v0.5.1 의 실패 모양(SEA 에 package.json 이 없다)은
      #    하나로도 잡히고, 타깃별로 갈리는 것은 아래 층①이 실행 없이 전수로 덮는다.
      #    📌 linux-x64 에서도 같은 증상이라는 것은 briefick 이 v0.5.1 자산으로 실측했다.
      # A release must say which compatibility class it is, and `receiver-first`/`breaking`
      # must name the receiver that was confirmed first — shipping before the RP widens is a
      # silent drop on their side (briefick#48/#25). The classes and their two properties come
      # from dist/wire-surface.js, so this gate cannot drift from the source.
      - name: Gate — the release declares its compatibility class
        run: |
          set -euo pipefail
          RELEASE_TAG="${{ github.event.release.tag_name }}" node scripts/release-compat-gate.mjs
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Gate — 태그 == package.json (릴리스 전용)
        run: |
          set -euo pipefail
          expected=$(node -p "require('./package.json').version")
          tag="${{ github.event.release.tag_name }}"

          # 🔴 **0.5.0 은 릴리스하지 않는다.** npm 에서 deprecate 된 결함 판이다 —
          #    모르는 옵션 오류에 **값이 그대로 노출**되고(`--code=<코드>` · `--url=<주소>`),
          #    `--port=8787` 같은 정상 등호형이 거부되며, `up` 이 `--port` 를 무시한다.
          # ⚠️ 지금 v0.5.0 릴리스가 **없는 것은 우연**이었고, 그 우연이 설치형 사용자를
          #    막아 주고 있었다(briefick 지적). 우연을 규칙으로 바꾼다 —
          #    소급해서 자르면 **설치형 사용자가 값 새는 판을 받게 된다.**
          case "$expected" in
            0.5.0) echo "🔴 0.5.0 은 릴리스 금지 — npm 에서 deprecate 된 결함 판이다."
                   echo "   값 노출·등호형 거부·up --port 무시. 0.5.1 이상을 쓸 것."
                   exit 1 ;;
          esac

          # 🔵 **손목록은 내가 아는 판만 막는다.** 다음 결함 판에도 듣게 npm 을 직접 본다
          #    (briefick 제안). 위 손목록은 그대로 둔다 — **바닥은 로컬**이어야 한다.
          # ⚠️ 이건 네트워크에 기댄다. 조회가 실패하면 **막지 않는다**(손목록이 이미 막고 있고,
          #    네트워크 장애로 릴리스를 못 자르게 하는 것이 더 나쁘다). 그 선을 여기 적어 둔다.
          dep=$(npm view "@metadium-did/platform-agent-js@$expected" deprecated 2>/dev/null || true)
          if [ -n "$dep" ]; then
            echo "🔴 npm 에서 **deprecate 된 판**을 릴리스하려 한다: $expected"
            echo "   사유: $dep"
            exit 1
          fi
          test "$tag" = "v$expected" || {
            echo "🔴 태그($tag)와 package.json(v$expected)이 다르다 — 잘못된 커밋에 태그가 붙었다"; exit 1; }
          echo "🟢 tag $tag == package.json v$expected"

      - name: Gate — the binaries (version, embedded Node, four targets)
        run: bash scripts/check-sea-binaries.sh
      - name: Sign SHA256SUMS (minisign — 릴리스 게이트)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          test -n "$MINISIGN_SECRET_KEY" || { echo "MINISIGN_SECRET_KEY secret 미설정 — 서명 없는 릴리스는 금지(fail-closed)"; exit 1; }
          brew install minisign
          printf '%s\n' "$MINISIGN_SECRET_KEY" > /tmp/minisign.key
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -Sm dist-bin/SHA256SUMS -s /tmp/minisign.key
          rm -f /tmp/minisign.key
      # 🔴 **게이트가 실패하면 릴리스는 이미 공개돼 있다**(`on: release: published` 는 릴리스
      #    객체가 생긴 **뒤** 돈다). 그대로 두면 «공개된 릴리스 + 자산 0개» 가 남고,
      #    소비처의 `gh release download <tag> -p install.sh` 가 **404** 로 죽는다.
      # ⚠️ v0.5.1 보다 조용하다 — 그건 「자산은 있는데 기능이 없는」 거라 쓰면 드러났고,
      #    이건 **설치 자체가 실패**한다(briefick 지적).
      - name: 실패하면 릴리스를 초안으로 되돌린다
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${{ github.event.release.tag_name }}" --draft
          echo "⚠️ 게이트 실패 — 릴리스를 초안으로 되돌렸다. 고친 뒤 다시 publish 하라."

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dist-bin/metapass-agent-darwin-arm64 dist-bin/metapass-agent-darwin-x64 \
            dist-bin/metapass-agent-linux-x64 dist-bin/metapass-agent-linux-arm64 \
            dist-bin/SHA256SUMS dist-bin/SHA256SUMS.minisig scripts/install.sh --clobber
