# SEA 단일 바이너리 릴리스(doc26 §2-6) — GitHub Release publish 시 4타깃 빌드·서명·자산 업로드.
# 게이트: SHA256SUMS를 minisign으로 서명(secret MINISIGN_SECRET_KEY 필요 — 없으면 실패 = fail-closed).
name: Release binaries
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  binaries:
    runs-on: macos-14   # darwin 코드사인(ad-hoc) 때문에 macOS 러너에서 4타깃 교차 생성
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: node scripts/build-sea.mjs --all
      # 🔴 **바이너리가 자기 판을 말하는지 여기서 잠근다.** v0.5.1 바이너리는 `--version` 이
      #    exit 1 로 «판을 읽지 못했다» 를 냈는데(SEA 에는 package.json 이 없다) 릴리스가
      #    그대로 나갔다 — 아무도 **자산을 받아 돌려 보지 않았기** 때문이다.
      # ⚠️ 파이프·명령치환으로 받지 않는다: 바이너리가 죽으면 종료코드가 삼켜지고
      #    빈 문자열 비교가 «다르다» 로만 보여 **원인이 안 보인다**.
      - name: Gate — 바이너리가 말하는 판 == package.json == 태그
        run: |
          set -euo pipefail
          expected=$(node -p "require('./package.json').version")
          tag="${{ github.event.release.tag_name }}"
          test "$tag" = "v$expected" || {
            echo "🔴 태그($tag)와 package.json(v$expected)이 다르다 — 잘못된 커밋에 태그가 붙었다"; exit 1; }
          ./dist-bin/metapass-agent-darwin-arm64 --version > /tmp/sea-version.txt
          actual=$(cat /tmp/sea-version.txt)
          test "$actual" = "$expected" || {
            echo "🔴 바이너리가 말하는 판($actual)이 package.json($expected)과 다르다"; exit 1; }
          echo "🟢 판 일치: $tag == v$actual"
      - name: Sign SHA256SUMS (minisign — 릴리스 게이트)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          test -n "$MINISIGN_SECRET_KEY" || { echo "MINISIGN_SECRET_KEY secret 미설정 — 서명 없는 릴리스는 금지(fail-closed)"; exit 1; }
          brew install minisign
          printf '%s\n' "$MINISIGN_SECRET_KEY" > /tmp/minisign.key
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -Sm dist-bin/SHA256SUMS -s /tmp/minisign.key
          rm -f /tmp/minisign.key
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dist-bin/metapass-agent-darwin-arm64 dist-bin/metapass-agent-darwin-x64 \
            dist-bin/metapass-agent-linux-x64 dist-bin/metapass-agent-linux-arm64 \
            dist-bin/SHA256SUMS dist-bin/SHA256SUMS.minisig scripts/install.sh --clobber
